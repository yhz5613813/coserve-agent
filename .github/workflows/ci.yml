# CoServe AI continuous integration.
#
# The upstream DeepSeek Harness workflows that used to live in this directory
# target DeepSeek's self-hosted runner pools, release keys, issue bots and
# publishing infrastructure. They cannot run on a fork, so this repository
# keeps one gate that a contributor can also run locally: install, typecheck
# the workspace, build the vendored CAStudio service, and check the bilingual
# documentation pairing.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A superseded run on the same ref must not queue behind a stale one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  # CI runs must never report to the production telemetry endpoint.
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck every workspace project
        run: pnpm run typecheck
      - name: Check bilingual documentation pairing
        run: pnpm run verify-translation-pairing
      - name: Check documentation links
        run: pnpm run verify-md-links
      - name: Check documentation wrapping
        run: pnpm run verify-md-wrap

  castudio:
    name: castudio service
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: castudio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: castudio/package-lock.json
      - name: Install CAStudio dependencies
        run: npm ci --no-audit --no-fund
      - name: Build the CAStudio service
        run: npm run build
