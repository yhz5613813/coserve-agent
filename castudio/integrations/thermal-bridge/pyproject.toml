[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coserve-thermoforge-bridge"
version = "0.3.1"
description = "CoServe thermal_sim v1 adapter for the pinned ThermoForge Studio P1 kernel"
requires-python = ">=3.12"
dependencies = ["numpy>=2", "pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
